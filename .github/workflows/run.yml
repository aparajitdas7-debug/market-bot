name: Market Bot Runner

on:
  schedule:
    # 03:32 UTC = 09:02 AM IST (সোমবার থেকে শুক্রবার)
    - cron: '32 3 * * 1-5'
  workflow_dispatch: # ম্যানুয়ালি টেস্ট করার বাটন

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        run: python bot.py
        
