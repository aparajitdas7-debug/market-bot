name: Run Market Bot Daily

on:
  schedule:
    # UTC 04:01 = IST (ভারতীয় সময়) সকাল 09:01 AM
    - cron: '31 3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Run Bot
        run: python bot.py
        
